<!DOCTYPE html>
<html lang="en">
<head>
<title>FWTI - Battlefield Support</title>
<meta charset="utf-8">
<meta name="description" content="A tool for browser Battlefield Support options">
<meta property="og:url" content="https://free-worlds-tech.github.io/battlefield-support.html">
<meta property="og:type" content="website">
<meta property="og:title" content="FWTI - Battlefield Support">
<meta property="og:description" content="A tool for browser Battlefield Support options">
<meta property="og:image" content="https://free-worlds-tech.github.io/assets/fwti-1200-630.png">
<meta name="twitter:card" content="summary_large_image">
<meta property="twitter:domain" content="free-worlds-tech.github.io">
<meta property="twitter:url" content="https://free-worlds-tech.github.io/battlefield-support.html">
<meta name="twitter:title" content="FWTI - Battlefield Support">
<meta name="twitter:description" content="A tool for browser Battlefield Support options">
<meta name="twitter:image" content="https://free-worlds-tech.github.io/assets/fwti-1200-630.png">
<link rel="icon" href="assets/fwti.svg" type="image/svg+xml">
<link rel="icon" href="assets/fwti-256.png" type="image/png">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="ext/simple.min.css">
<link rel="stylesheet" href="css/fwti.css">
<script charset="UTF-8" src="script/fwti.js" defer></script>
<script charset="UTF-8" src="script/battlefield-support.js" defer></script>
</head>
<body>

<header>
    <img class="logo" src="assets/fwti-256.png" alt="FWTI logo">
    <h1>Free Worlds Technical Institute</h1>
    <nav id="site-nav" data-current="battlefield-support"></nav>
</header>

<h2>Battlefield Support</h2>
<p>
    This page allows for browsing the many Battlefield Support options
    available for BattleTech.
</p>

<div id="support-card" style="margin-bottom: 36px;">
    <div><strong>NAME: </strong><span id="sc-name"></span></div>
    <div><strong>BSP: </strong><span id="sc-bsp"></span></div>
    <div><strong>MP: </strong><span id="sc-mp"></span></div>
    <div><strong>TMM: </strong><span id="sc-tmm"></span></div>
    <div><strong>RANGE: </strong><span id="sc-range"></span></div>
    <div><strong>SKILL: </strong><span id="sc-skill"></span></div>
    <div><strong>DMG: </strong><span id="sc-dmg"></span></div>
    <div><strong>CHECK: </strong><span id="sc-check"></span></div>
    <div><strong>THRESHOLD: </strong><span id="sc-threshold"></span></div>
    <div><strong>SPECIALS: </strong><span id="sc-specials"></span></div>
    <div><strong>SOURCE: </strong><span id="sc-source"></span></div>
</div>

<label for="search-text">Search</label>
<input type="text" id="search-text">

<ul id="support-list" class="search-results-list"></ul>

<footer>
    <p>Maintained by <a href="https://github.com/scottboehmer">Scott Boehmer</a></p>
</footer>
</body>
</html>
